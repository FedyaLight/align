name: align-rs

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "script/**"
      - "Support/aaf/**"
      - ".github/workflows/align-rs.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "script/**"
      - "Support/aaf/**"
  workflow_dispatch:

jobs:
  check-test:
    name: check · test · clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # System FFmpeg for the portable backend's container tier + fixtures.
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libudev-dev libvulkan-dev
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: cargo check
        run: cargo check --workspace --all-targets
      - name: cargo clippy (deny warnings, ours)
        # Transitive future-incompat notices are not ours; fail only on real lints.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build AAF module
        run: |
          python -m pip install -r Support/aaf/build-requirements.txt
          python -m unittest discover -s Support/aaf -v
          python script/build-aaf-sidecar.py target/release
      - name: Build release CLI
        run: cargo build --release -p align-cli
      - name: Verify release CLI
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          python script/check-release-smoke.py "target/release/align-cli$exe" release-smoke
      - name: Verify preserve basic editing
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          python script/check-preserve-editing-smoke.py --cli "target/release/align-cli$exe" --output release-smoke/preserve-editing
      - name: Verify bundled AAF import and export
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          python script/check-aaf-smoke.py "target/release/align-cli$exe" release-smoke
          python script/check-aaf-picture-smoke.py "target/release/align-cli$exe" release-smoke/aaf-picture
          python script/check-aaf-embedded-smoke.py "target/release/align-cli$exe" release-smoke/aaf-embedded
          python script/check-aaf-embedded-smoke.py "target/release/align-cli$exe" release-smoke/aaf-embedded-stereo --channels 2
          python script/check-aaf-embedded-smoke.py "target/release/align-cli$exe" release-smoke/aaf-mixed-clocks --channels 2 --mixed-clocks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: release-smoke/


  release:
    name: release binaries (${{ matrix.os }})
    needs: check-test
    if: startsWith(github.ref, 'refs/tags/align-rs-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: >-
            curl diffutils make mingw-w64-x86_64-gcc nasm pkgconf tar xz
      - name: Build release
        run: cargo build --release -p align-cli -p align-gpui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build AAF module
        run: |
          python -m pip install -r Support/aaf/build-requirements.txt
          python script/build-aaf-sidecar.py target/release
      - name: Build minimal FFmpeg sidecars (Unix)
        if: runner.os != 'Windows'
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Build minimal FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Stage release
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          mkdir -p dist-bundle
          cp "target/release/align-cli$exe" "target/release/align$exe" dist-bundle/
          cp "target/release/align-aaf$exe" dist-bundle/
          cp -R target/release/AAF-Licenses dist-bundle/
          cp THIRD_PARTY_NOTICES.txt dist-bundle/
          cp target/ffmpeg-minimal/* dist-bundle/
          ls -la dist-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: align-${{ runner.os }}
          path: dist-bundle/
