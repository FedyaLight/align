name: align-rs

on:
  # Pushes run on main and release tags only: a pull request from a branch
  # of this repository already runs below, so a branch push would start a
  # second full matrix for the same commit. Tag pushes ignore path filters.
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".cargo/**"
      - "about.toml"
      - "script/**"
      - "Support/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.txt"
      - ".github/workflows/align-rs.yml"
  # Every pull request runs, so the required "checks" status always reports.
  pull_request:
  workflow_dispatch:

# A newer push to the same branch supersedes a running check; release
# tags always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check-test:
    name: test · clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # System FFmpeg for the portable backend's container tier + fixtures.
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libudev-dev libvulkan-dev
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Check formatting and documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo doc --workspace --no-deps
      - name: Lint workspace
        # Transitive future-incompat notices are not ours; fail only on real lints.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        # Tests that generate fixtures with FFmpeg fail instead of skipping.
        env:
          ALIGN_REQUIRE_FFMPEG: "1"
        run: cargo test --workspace --locked
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install AAF fixture requirements
        run: python -m pip install -r Support/aaf/requirements.txt
      - name: Verify AAF reference and release source checks
        run: |
          python -m unittest discover -s Support/aaf -v
          python script/test-release-source.py
      # Rebuild the sidecars only when their build script changes. Release
      # builds always compile them fresh and verify the staged files, which
      # also catches MSYS2 toolchain changes before anything is published.
      - name: Restore FFmpeg sidecars (Windows)
        id: ffmpeg-sidecars
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: target/ffmpeg-minimal
          key: ffmpeg-sidecars-windows-${{ hashFiles('script/build-ffmpeg-minimal.sh') }}
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows' && steps.ffmpeg-sidecars.outputs.cache-hit != 'true'
        with:
          msystem: MINGW64
          install: >-
            curl diffutils make mingw-w64-x86_64-gcc nasm pkgconf tar xz
      - name: Build minimal FFmpeg sidecars (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-sidecars.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Verify standalone sidecars (Windows)
        if: runner.os == 'Windows'
        run: python script/check-windows-sidecars.py target/ffmpeg-minimal
      - name: Build release CLI and AAF helper
        run: cargo build --locked --release -p align-cli -p align-aaf
      - name: Verify release end to end
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          python script/check-end-to-end.py "target/release/align-cli$exe" release-smoke
      - name: Show acceptance logs
        if: failure()
        shell: bash
        run: |
          for log in release-smoke/*.log; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            tail -n 80 "$log"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: release-smoke/

  # One status for branch protection, independent of the platform matrix.
  checks:
    name: checks
    if: always()
    needs: check-test
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform to pass
        if: needs.check-test.result != 'success'
        run: |
          echo "test · clippy finished with: ${{ needs.check-test.result }}"
          exit 1

  # Tags vX.Y.Z build and publish every installer. A manual run on any
  # branch builds the same installers as artifacts without publishing.
  release:
    name: release binaries (${{ matrix.os }})
    env:
      VELOPACK_VERSION: 1.2.0
    needs: check-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are built against the oldest glibc the packages
        # support (2.39), so they run on current Fedora and Arch.
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME#v}" != "$workspace_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $workspace_version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: Swatinem/rust-cache@v2
      - name: Remove packaging outputs restored from cache
        # rust-cache saves all of target/, including folders the packaging steps
        # create and refuse to overwrite. Re-running a tag would restore them.
        shell: bash
        run: |
          rm -rf target/macos-package target/dmg-venv target/release-sources \
            target/ffmpeg-minimal
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: >-
            curl diffutils make mingw-w64-x86_64-gcc nasm pkgconf tar xz
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y nasm libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libasound2-dev libudev-dev libvulkan-dev
          libgtk-4-dev rpm patchelf
      - name: Install assembler (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Build release
        run: cargo build --locked --release -p align-cli -p align-gpui -p align-aaf
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # macOS decodes and remuxes through AVFoundation and native QuickTime
      # code; its FFmpeg reads only MXF, which AVFoundation cannot open.
      - name: Build minimal FFmpeg sidecars (Linux, macOS)
        if: runner.os != 'Windows'
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Build minimal FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Stage release
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          mkdir -p dist-bundle
          cp "target/release/align$exe" dist-bundle/
          if [[ -n "$exe" ]]; then
            cp target/release/align-cli.exe dist-bundle/
          else
            ln -s align dist-bundle/align-cli
          fi
          cp "target/release/align-aaf$exe" dist-bundle/
          python script/check-aaf-sidecar.py "dist-bundle/align-aaf$exe"
          mkdir dist-bundle/AAF-Licenses
          cp crates/align-aaf/PYAAF2-LICENSE.txt dist-bundle/AAF-Licenses/
          cp LICENSE THIRD_PARTY_NOTICES.txt dist-bundle/
          cp "target/ffmpeg-minimal/ffmpeg$exe" "target/ffmpeg-minimal/ffprobe$exe" dist-bundle/
          shopt -s nullglob
          for library in target/ffmpeg-minimal/*.so.* target/ffmpeg-minimal/*.dylib; do
            cp "$library" dist-bundle/
          done
          "dist-bundle/ffmpeg$exe" -version >/dev/null
          "dist-bundle/ffprobe$exe" -version >/dev/null
          cp target/ffmpeg-minimal/FFMPEG-LICENSE.txt dist-bundle/
          ls -la dist-bundle/
      - name: Verify staged sidecars without MSYS2 (Windows)
        if: runner.os == 'Windows'
        # Native Python and a clean child PATH expose missing runtime DLLs.
        run: python script/check-windows-sidecars.py dist-bundle
      - name: Install dependency license generator
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Prepare corresponding sources and dependency licenses
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          python script/prepare-release-source.py target/release-sources \
            --platform ${{ runner.os }} \
            --licenses dist-bundle/ThirdPartyLicenses \
            --ffmpeg target/ffmpeg-minimal/Sources \
            --aaf-binary "dist-bundle/align-aaf$exe" \
            --velopack-version ${{ env.VELOPACK_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: sources-${{ runner.os }}
          path: target/release-sources/
          if-no-files-found: error

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python -m venv --clear "$RUNNER_TEMP/dmg-venv"
          "$RUNNER_TEMP/dmg-venv/bin/python" -m pip install dmgbuild==1.6.7
          RELEASE_LICENSES="$PWD/dist-bundle/ThirdPartyLicenses" \
          BUNDLE_FFMPEG=1 \
          FFMPEG_DIR="$PWD/target/ffmpeg-minimal" \
          ALIGN_SKIP_LAUNCH_CHECK=1 \
            ./script/package-macos.sh "$PWD/target/macos-package"
          mkdir -p installers
          PYTHON="$RUNNER_TEMP/dmg-venv/bin/python" ./script/create-macos-dmg.sh \
            target/macos-package/Align.app "installers/Align-$version-macOS-arm64.dmg"
      - name: Verify AAF in the mounted macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          image=(installers/Align-*-macOS-arm64.dmg)
          mount_dir="$(mktemp -d)"
          trap 'hdiutil detach "$mount_dir" >/dev/null; rmdir "$mount_dir"' EXIT
          hdiutil attach "${image[0]}" -readonly -nobrowse -mountpoint "$mount_dir"
          bundle="$mount_dir/Align.app"
          codesign --verify --deep --strict "$bundle"
          python script/check-aaf-sidecar.py "$bundle/Contents/MacOS/align-aaf" \
            --cli "$bundle/Contents/MacOS/align-cli"
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: "8.0.x"
      - name: Build installer and update feed (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global vpk --version ${{ env.VELOPACK_VERSION }}
          ./script/package-windows.sh dist-bundle installers
          # The update feed lets installed copies update in place; the
          # generic Setup name duplicates the versioned installer.
          rm installers/updates/com.align.app-win-Setup.exe
          mv installers/updates/* installers/
          rmdir installers/updates
      - name: Verify AAF after Windows Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem installers/Align-*-Windows-x64-Setup.exe).FullName
          $destination = Join-Path $env:RUNNER_TEMP 'align-install'
          $log = Join-Path $env:RUNNER_TEMP 'align-setup.log'
          $setup = Start-Process -FilePath $installer -ArgumentList @(
            '--silent', '--installto', ('"{0}"' -f $destination), '--log', ('"{0}"' -f $log)
          ) -Wait -PassThru
          if ($setup.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log }
            throw "Align Setup exited with code $($setup.ExitCode)"
          }
          python script/check-aaf-sidecar.py "$destination/current/align-aaf.exe" `
            --cli "$destination/current/align-cli.exe"
      - name: Build Fedora package and installer (Linux)
        if: runner.os == 'Linux'
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          ./script/package-fedora.sh dist-bundle installers
          ./script/package-fedora-gui.sh "installers/Align-$version-Fedora-x86_64.rpm" \
            "installers/Align-$version-Fedora-x86_64-Setup.run"
          # Artifacts drop Unix permissions; the Arch job unpacks this.
          tar -czf linux-stage.tar.gz -C dist-bundle .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-stage
          path: linux-stage.tar.gz
          if-no-files-found: error
      - name: List installers
        shell: bash
        run: ls -la installers/ && cat installers/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: installers/
          if-no-files-found: error

  arch:
    name: Omarchy / Arch package
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed base-devel gtk4 pkgconf python
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: linux-stage
      - name: Build package and installer
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          mkdir stage out
          tar -xzf linux-stage.tar.gz -C stage
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder "$PWD"
          su builder -c "bash ./script/package-arch.sh stage out"
          bash ./script/package-arch-gui.sh "out/align-$version-1-x86_64.pkg.tar.zst" \
            "out/Align-$version-Omarchy-x86_64-Setup.run"
          mkdir installers
          mv out/*.pkg.tar.zst* out/*.run* installers/
      - name: Install and run the package
        run: |
          pacman -U --noconfirm installers/*.pkg.tar.zst
          align-cli --help >/dev/null
          python script/check-aaf-sidecar.py /opt/align/align-aaf --cli /usr/bin/align-cli
          pacman -Qkk align
      - uses: actions/upload-artifact@v4
        with:
          name: installers-Arch
          path: installers/
          if-no-files-found: error

  fedora:
    name: Fedora package check
    needs: release
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install package test tools
        run: dnf install -y python3 tar gzip
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: installers-Linux
      - name: Install and run the package
        run: |
          dnf install -y ./Align-*-Fedora-x86_64.rpm
          align-cli --help >/dev/null
          python3 script/check-aaf-sidecar.py /opt/align/align-aaf --cli /usr/bin/align-cli
          rpm -V align
          sha256sum -c ./*.sha256

  publish-release:
    name: publish GitHub release
    needs: [release, arch, fedora]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: sources-*
          path: release-assets
          merge-multiple: true
      - name: Verify every download
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release-assets
          for asset in \
            "Align-$version-macOS-arm64.dmg" \
            "Align-$version-Windows-x64-Setup.exe" \
            "Align-$version-Fedora-x86_64-Setup.run" \
            "Align-$version-Fedora-x86_64.rpm" \
            "Align-$version-Omarchy-x86_64-Setup.run" \
            "align-$version-1-x86_64.pkg.tar.zst" \
            align-source-Linux.tar.gz align-source-macOS.tar.gz align-source-Windows.tar.gz; do
            test -s "$asset"
          done
          sha256sum -c ./*.sha256
          test -s releases.win.json
          sed "s/@VERSION@/$version/g" ../.github/release-notes.md > ../release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Align ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
