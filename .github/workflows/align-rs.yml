name: align-rs

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "script/**"
      - "Support/aaf/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/align-rs.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "script/**"
      - "Support/aaf/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - ".github/workflows/align-rs.yml"
  workflow_dispatch:

jobs:
  check-test:
    name: test · clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # System FFmpeg for the portable backend's container tier + fixtures.
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libudev-dev libvulkan-dev
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Check formatting and documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo doc --workspace --no-deps
      - name: Lint workspace
        # Transitive future-incompat notices are not ours; fail only on real lints.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build AAF module
        run: |
          python -m pip install -r Support/aaf/build-requirements.txt
          python -m unittest discover -s Support/aaf -v
          python script/build-aaf-sidecar.py target/release
      - name: Build release CLI
        run: cargo build --release -p align-cli
      - name: Verify release end to end
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          python script/check-end-to-end.py "target/release/align-cli$exe" release-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: release-smoke/


  release:
    name: release binaries (${{ matrix.os }})
    needs: check-test
    if: startsWith(github.ref, 'refs/tags/align-rs-v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: >-
            curl diffutils make mingw-w64-x86_64-gcc nasm pkgconf tar xz
      - name: Build release
        run: cargo build --release -p align-cli -p align-mcp -p align-gpui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build AAF module
        run: |
          python -m pip install -r Support/aaf/build-requirements.txt
          python script/build-aaf-sidecar.py target/release
      - name: Build minimal FFmpeg sidecars (Unix)
        if: runner.os != 'Windows'
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Build minimal FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Stage release
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          mkdir -p dist-bundle
          cp "target/release/align-cli$exe" "target/release/align-mcp$exe" "target/release/align$exe" dist-bundle/
          cp "target/release/align-aaf$exe" dist-bundle/
          cp -R target/release/AAF-Licenses dist-bundle/
          cp LICENSE THIRD_PARTY_NOTICES.txt dist-bundle/
          cp target/ffmpeg-minimal/* dist-bundle/
          ls -la dist-bundle/
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"
      - name: Install Velopack packager
        run: dotnet tool install --global vpk --version 1.2.0
      - name: Build installable update package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#align-rs-v}"
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "$version" != "$workspace_version" ]]; then
            echo "Tag version $version does not match Cargo.toml version $workspace_version" >&2
            exit 1
          fi
          exe=""
          icon="Support/AppIcon.png"
          extra=()
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            exe=".exe"
            icon=""
          elif [[ "${{ runner.os }}" == "macOS" ]]; then
            icon="Support/AppIcon.icns"
            extra+=(--bundleId com.align.app)
          fi
          args=(pack --packId com.align.app --packTitle Align --packVersion "$version" --packDir dist-bundle --mainExe "align$exe" --outputDir velopack-release)
          if [[ -n "$icon" ]]; then args+=(--icon "$icon"); fi
          vpk "${args[@]}" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: align-${{ runner.os }}
          path: dist-bundle/
      - uses: actions/upload-artifact@v4
        with:
          name: updates-${{ runner.os }}
          path: velopack-release/

  publish-release:
    name: publish GitHub release
    needs: release
    if: startsWith(github.ref, 'refs/tags/align-rs-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: updates-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
