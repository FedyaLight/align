name: align-rs

on:
  push:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "script/**"
      - "Support/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.txt"
      - ".github/workflows/align-rs.yml"
  pull_request:
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "script/**"
      - "Support/**"
      - "docs/**"
      - "README.md"
      - "LICENSE"
      - "THIRD_PARTY_NOTICES.txt"
      - ".github/workflows/align-rs.yml"
  workflow_dispatch:

# A newer push to the same branch supersedes a running check; release
# tags always run to completion.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  check-test:
    name: test · clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # System FFmpeg for the portable backend's container tier + fixtures.
      - name: Install FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libasound2-dev libudev-dev libvulkan-dev
      - name: Install FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y
      - name: Check formatting and documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo fmt --all -- --check
          cargo doc --workspace --no-deps
      - name: Lint workspace
        # Transitive future-incompat notices are not ours; fail only on real lints.
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build AAF module
        run: |
          python -m pip install -r Support/aaf/build-requirements.txt
          python -m unittest discover -s Support/aaf -v
          python script/test-release-source.py
          python script/build-aaf-sidecar.py target/release
      - name: Build release CLI
        run: cargo build --locked --release -p align-cli
      - name: Verify release end to end
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          python script/check-end-to-end.py "target/release/align-cli$exe" release-smoke
      - name: Show acceptance logs
        if: failure()
        shell: bash
        run: |
          for log in release-smoke/*.log; do
            [[ -f "$log" ]] || continue
            echo "::group::$log"
            tail -n 80 "$log"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ runner.os }}
          path: release-smoke/


  # Tags vX.Y.Z build and publish every installer. A manual run on any
  # branch builds the same installers as artifacts without publishing.
  release:
    name: release binaries (${{ matrix.os }})
    env:
      VELOPACK_VERSION: 1.2.0
    needs: check-test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux binaries are built against the oldest glibc the packages
        # support (2.39), so they run on current Fedora and Arch.
        os: [macos-latest, windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          workspace_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          if [[ "${GITHUB_REF_NAME#v}" != "$workspace_version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $workspace_version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: MINGW64
          install: >-
            curl diffutils make mingw-w64-x86_64-gcc nasm pkgconf tar xz
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y nasm libxkbcommon-dev
          libxkbcommon-x11-dev libwayland-dev libasound2-dev libudev-dev libvulkan-dev
          libgtk-4-dev rpm
      - name: Install assembler (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm
      - name: Build release
        run: cargo build --locked --release -p align-cli -p align-mcp -p align-gpui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build AAF module
        run: |
          python -m pip install -r Support/aaf/build-requirements.txt
          python script/build-aaf-sidecar.py target/release --release-sources
      # macOS decodes and remuxes through AVFoundation and native QuickTime
      # code, so its installer ships no FFmpeg.
      - name: Build minimal FFmpeg sidecars (Linux)
        if: runner.os == 'Linux'
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Build minimal FFmpeg sidecars (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: ./script/build-ffmpeg-minimal.sh target/ffmpeg-minimal
      - name: Stage release
        shell: bash
        run: |
          exe=""
          if [[ "${{ runner.os }}" == "Windows" ]]; then exe=".exe"; fi
          mkdir -p dist-bundle
          cp "target/release/align-cli$exe" "target/release/align-mcp$exe" "target/release/align$exe" dist-bundle/
          cp "target/release/align-aaf$exe" dist-bundle/
          cp -R target/release/AAF-Licenses dist-bundle/
          cp LICENSE THIRD_PARTY_NOTICES.txt dist-bundle/
          if [[ "${{ runner.os }}" != "macOS" ]]; then
            cp "target/ffmpeg-minimal/ffmpeg$exe" "target/ffmpeg-minimal/ffprobe$exe" dist-bundle/
            cp target/ffmpeg-minimal/FFMPEG-LICENSE.txt dist-bundle/
          fi
          ls -la dist-bundle/
      - name: Install dependency license generator
        run: cargo install cargo-about --version 0.9.2 --features cli --locked
      - name: Prepare corresponding sources and dependency licenses
        shell: bash
        run: |
          ffmpeg=()
          if [[ "${{ runner.os }}" != "macOS" ]]; then
            ffmpeg=(--ffmpeg target/ffmpeg-minimal/Sources)
          fi
          python script/prepare-release-source.py target/release-sources \
            --platform ${{ runner.os }} \
            --licenses dist-bundle/ThirdPartyLicenses \
            "${ffmpeg[@]}" \
            --aaf target/release/AAF-Sources \
            --velopack-version ${{ env.VELOPACK_VERSION }}
      - uses: actions/upload-artifact@v4
        with:
          name: sources-${{ runner.os }}
          path: target/release-sources/
          if-no-files-found: error

      - name: Build DMG (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          python -m venv target/dmg-venv
          target/dmg-venv/bin/python -m pip install dmgbuild==1.6.7
          AAF_DIR="$PWD/target/release" \
          RELEASE_LICENSES="$PWD/dist-bundle/ThirdPartyLicenses" \
          ALIGN_SKIP_LAUNCH_CHECK=1 \
            ./script/package-macos.sh "$PWD/target/macos-package"
          mkdir -p installers
          PYTHON="$PWD/target/dmg-venv/bin/python" ./script/create-macos-dmg.sh \
            target/macos-package/Align.app "installers/Align-$version-macOS-arm64.dmg"
      - uses: actions/setup-dotnet@v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: "8.0.x"
      - name: Build installer and update feed (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global vpk --version ${{ env.VELOPACK_VERSION }}
          ./script/package-windows.sh dist-bundle installers
          # The update feed lets installed copies update in place; the
          # generic Setup name duplicates the versioned installer.
          rm installers/updates/com.align.app-win-Setup.exe
          mv installers/updates/* installers/
          rmdir installers/updates
      - name: Build Fedora package and installer (Linux)
        if: runner.os == 'Linux'
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          ./script/package-fedora.sh dist-bundle installers
          ./script/package-fedora-gui.sh "installers/Align-$version-Fedora-x86_64.rpm" \
            "installers/Align-$version-Fedora-x86_64-Setup.run"
          # Artifacts drop Unix permissions; the Arch job unpacks this.
          tar -czf linux-stage.tar.gz -C dist-bundle .
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: linux-stage
          path: linux-stage.tar.gz
          if-no-files-found: error
      - name: List installers
        shell: bash
        run: ls -la installers/ && cat installers/*.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: installers/
          if-no-files-found: error

  arch:
    name: Omarchy / Arch package
    needs: release
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Install packaging tools
        run: pacman -Syu --noconfirm --needed base-devel gtk4 pkgconf
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: linux-stage
      - name: Build package and installer
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          mkdir stage out
          tar -xzf linux-stage.tar.gz -C stage
          # makepkg refuses to run as root.
          useradd --create-home builder
          chown -R builder "$PWD"
          su builder -c "bash ./script/package-arch.sh stage out"
          bash ./script/package-arch-gui.sh "out/align-$version-1-x86_64.pkg.tar.zst" \
            "out/Align-$version-Omarchy-x86_64-Setup.run"
          mkdir installers
          mv out/*.pkg.tar.zst* out/*.run* installers/
      - name: Install and run the package
        run: |
          pacman -U --noconfirm installers/*.pkg.tar.zst
          align-cli --help >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | align-mcp | grep -q align_sync
          pacman -Qkk align
      - uses: actions/upload-artifact@v4
        with:
          name: installers-Arch
          path: installers/
          if-no-files-found: error

  fedora:
    name: Fedora package check
    needs: release
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: installers-Linux
      - name: Install and run the package
        run: |
          dnf install -y ./Align-*-Fedora-x86_64.rpm
          align-cli --help >/dev/null
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | align-mcp | grep -q align_sync
          rpm -V align
          sha256sum -c ./*.sha256

  publish-release:
    name: publish GitHub release
    needs: [release, arch, fedora]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          pattern: installers-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v5
        with:
          pattern: sources-*
          path: release-assets
          merge-multiple: true
      - name: Verify every download
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          cd release-assets
          for asset in \
            "Align-$version-macOS-arm64.dmg" \
            "Align-$version-Windows-x64-Setup.exe" \
            "Align-$version-Fedora-x86_64-Setup.run" \
            "Align-$version-Fedora-x86_64.rpm" \
            "Align-$version-Omarchy-x86_64-Setup.run" \
            "align-$version-1-x86_64.pkg.tar.zst" \
            align-source-Linux.tar.gz align-source-macOS.tar.gz align-source-Windows.tar.gz; do
            test -s "$asset"
          done
          sha256sum -c ./*.sha256
          test -s releases.win.json
          sed "s/@VERSION@/$version/g" ../.github/release-notes.md > ../release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Align ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
